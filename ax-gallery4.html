function fillFilters(){[...new Set(tasks.map(t=>t.dept))].sort((a,b)=>a.localeCompare(b,'ko')).forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;dept.appendChild(o)});document.getElementById('total').textContent=tasks.length+'개';document.getElementById('deptCount').textContent=new Set(tasks.map(t=>t.dept)).size+'개';document.getElementById('lifeCount').textContent=tasks.filter(t=>t.cat==='라이프').length+'개';document.getElementById('runCount').textContent=tasks.filter(t=>t.url).length+'개'}
function thumb(t){if(t.img)return `<img src="${t.img}" alt="${t.title} 썸네일" loading="lazy">`;const parts=(t.mock||t.title+'|AI,Data,Report|분석,예측,실행').split('|');const boxes=(parts[1]||'AI,Data,Report').split(',').map(x=>`<div class="mini-box">${x}</div>`).join('');return `<div class="fallback"><div class="mini-title">${parts[0]}</div><div class="mini-grid">${boxes}</div><div class="mini-bars"><i style="height:32%"></i><i style="height:78%"></i><i style="height:48%"></i><i style="height:92%"></i><i style="height:58%"></i></div><div class="mini-chip">${(parts[2]||'AI,예측,자동화').replaceAll(',', ' · ')}</div></div>`}
function card(t){return `<article class="card" tabindex="0" data-title="${t.title}"><div class="thumb">${thumb(t)}</div><div class="body"><div class="meta"><div class="icon">${t.icon}</div><div class="dept">${t.dept}</div><div class="status ${t.status==='완료'?'':'todo'}">${t.status}</div></div><h3>${t.title}</h3><div class="desc">${t.desc}</div><div class="tags">${t.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="foot"><span>${t.cat}</span><span>${t.url?'카드 클릭으로 앱 실행':'링크 준비 중'}</span></div></div></article>`}
function render(){const term=q.value.trim().toLowerCase(),d=dept.value;let any=false;sections.innerHTML='';cats.forEach(cat=>{if(current!=='전체'&&current!==cat)return;const list=tasks.filter(t=>t.cat===cat&&(d==='전체'||t.dept===d)&&(!term||(t.title+t.dept+t.desc+t.tags.join(' ')).toLowerCase().includes(term)));if(!list.length)return;any=true;const sec=document.createElement('section');sec.innerHTML=`<div class="section-title"><h2>${cat}</h2><span>${list.length}개 과제</span></div><div class="grid">${list.map(card).join('')}</div>`;sections.appendChild(sec);sec.querySelectorAll('.card').forEach((el,i)=>{el.onclick=()=>openApp(list[i]);el.onkeydown=e=>{if(e.key==='Enter')openApp(list[i])}})});empty.style.display=any?'none':'block'}
function openApp(t){const drawer=document.getElementById('drawer'),wrap=document.getElementById('frameWrap'),open=document.getElementById('openNew');document.getElementById('panelTitle').textContent=t.title;if(t.url){open.href=t.url;open.style.display='inline-block';wrap.innerHTML=`<iframe src="${t.url}" title="${t.title}"></iframe>`}else{open.style.display='none';wrap.innerHTML='<div class="noapp">이 과제는 Notion에는 등록되어 있지만 실행 URL은 아직 준비 중입니다.</div>'}drawer.classList.add('on')}
document.getElementById('shade').onclick=document.getElementById('close').onclick=()=>document.getElementById('drawer').classList.remove('on');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.cat;render()});q.oninput=render;dept.onchange=render;fillFilters();render();
</script>
</body>
</html>
