<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AX 과제 갤러리 v2 — 부서별 AI 적용 사례</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;background:#F1F5F9;color:#1E293B;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── NAV ── */
.nav{height:56px;background:#fff;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:200;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.nav-logo{display:flex;align-items:center;gap:8px;margin-right:28px;flex-shrink:0;text-decoration:none;color:inherit}
.nav-logo-icon{width:32px;height:32px;background:#2563EB;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900}
.nav-logo-text{font-size:14px;font-weight:700;color:#0F172A;white-space:nowrap}
.nav-items{display:flex;align-items:stretch;flex:1;gap:0}
.nav-item{display:flex;align-items:center;gap:6px;padding:0 14px;height:56px;font-size:13px;font-weight:500;color:#64748B;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;cursor:pointer}
.nav-item:hover{color:#1E293B}
.nav-item.active{color:#2563EB;font-weight:700;border-bottom-color:#2563EB}
.nav-right{display:flex;align-items:center;gap:4px;margin-left:12px}
.nav-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#64748B;cursor:pointer;transition:background .15s;border:none;background:transparent}
.nav-btn:hover{background:#F1F5F9;color:#1E293B}

/* ── MAIN ── */
.main{max-width:1400px;margin:0 auto;padding:28px 24px 52px}

/* ── HERO ── */
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.hero-left h1{font-size:24px;font-weight:800;color:#0F172A;margin-bottom:6px;letter-spacing:-.5px}
.hero-left p{font-size:13px;color:#64748B;line-height:1.7}
.hero-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fpill{padding:7px 16px;border-radius:24px;font-size:13px;font-weight:600;border:1.5px solid #E2E8F0;background:#fff;color:#475569;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.fpill:hover{border-color:#CBD5E1;color:#1E293B;background:#F8FAFC}
.fpill.on{background:#2563EB;color:#fff;border-color:#2563EB}
.hero-actions{display:flex;gap:8px;align-items:center}
.btn-new{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;background:#2563EB;color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap;transition:background .15s}
.btn-new:hover{background:#1D4ED8}
.btn-import{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;background:#fff;color:#475569;font-size:12px;font-weight:600;border:1.5px solid #E2E8F0;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.btn-import:hover{border-color:#2563EB;color:#2563EB}
.btn-export{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:10px;background:#fff;color:#475569;font-size:12px;font-weight:600;border:1.5px solid #E2E8F0;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.btn-export:hover{border-color:#059669;color:#059669}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

/* ── CARD ── */
.card{background:#fff;border-radius:14px;border:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);overflow:visible;cursor:pointer;transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s,border-color .2s;text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 32px rgba(0,0,0,.1),0 4px 12px rgba(37,99,235,.08);border-color:rgba(37,99,235,.2)}
.card-inner{overflow:hidden;border-radius:14px;display:flex;flex-direction:column;flex:1}

/* Card thumbnail */
.thumb{width:100%;overflow:hidden;line-height:0;flex-shrink:0;border-radius:14px 14px 0 0}
.thumb svg{width:100%;height:auto;display:block}

/* Card body */
.cbody{padding:15px 16px 16px;display:flex;align-items:flex-start;gap:12px;flex:1}
.cicon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;margin-top:1px}
.cinfo{flex:1;min-width:0}
.cname-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:5px;position:relative}
.cname{font-size:15px;font-weight:700;color:#0F172A;line-height:1.3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdots{font-size:16px;font-weight:700;color:#CBD5E1;letter-spacing:1px;cursor:pointer;flex-shrink:0;line-height:1;padding:2px 4px;border-radius:4px;transition:background .15s,color .15s;position:relative}
.cdots:hover{background:#F1F5F9;color:#64748B}
.cdots-menu{position:absolute;right:0;top:24px;background:#fff;border:1px solid #E2E8F0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:120px;z-index:100;display:none;overflow:hidden}
.cdots-menu.open{display:block}
.cdots-menu-item{padding:8px 14px;font-size:12px;font-weight:600;color:#475569;cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:7px}
.cdots-menu-item:hover{background:#F8FAFC;color:#1E293B}
.cdots-menu-item.danger{color:#EF4444}
.cdots-menu-item.danger:hover{background:#FEF2F2}
.cdesc{font-size:12px;color:#64748B;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.cstatus{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* Empty */
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:#94A3B8;font-size:15px}

/* ── MODAL ── */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 64px rgba(0,0,0,.2);transform:translateY(20px) scale(.97);transition:transform .2s,opacity .2s;opacity:0;max-height:90vh;overflow-y:auto}
.backdrop.open .modal{transform:none;opacity:1}
.modal-head{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:800;color:#0F172A}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:18px;transition:background .15s,color .15s}
.modal-close:hover{background:#F1F5F9;color:#475569}
.modal-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.04em}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;color:#0F172A;font-family:inherit;transition:border-color .15s,box-shadow .15s;background:#fff;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-textarea{resize:vertical;min-height:72px;line-height:1.5}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi-pair{display:grid;grid-template-columns:1.2fr 1fr;gap:6px}
.kpi-label-text{font-size:11px;color:#94A3B8;margin-bottom:3px}
.form-hint{font-size:11px;color:#94A3B8;margin-top:2px}
.modal-foot{padding:0 24px 24px;display:flex;gap:10px;justify-content:flex-end}
.btn-cancel{padding:9px 20px;border-radius:8px;border:1.5px solid #E2E8F0;background:#fff;color:#475569;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-cancel:hover{border-color:#CBD5E1;color:#1E293B}
.btn-submit{padding:9px 24px;border-radius:8px;background:#2563EB;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:background .15s}
.btn-submit:hover{background:#1D4ED8}
.section-title{font-size:12px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;padding:4px 0 2px;border-top:1px solid #F1F5F9;margin-top:4px}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── RESPONSIVE ── */
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)};.main{padding:20px 14px 36px}}
@media(max-width:540px){.grid{grid-template-columns:1fr};.hero{flex-direction:column};.form-row{grid-template-columns:1fr}}

/* hidden file input */
#importFile{display:none}
</style>
</head>
<body>

<!-- MAIN -->
<main class="main">
  <div class="hero">
    <div class="hero-left">
      <h1>부서 및 업무 갤러리</h1>
      <p>부서별 AI 과제와 데모 앱을 확인하고, 새 과제를 등록해 보세요.</p>
    </div>
    <div class="hero-right">
      <div class="filter-row" id="filters">
        <button class="fpill on" data-f="all">전체</button>
        <button class="fpill" data-f="제조기술">제조기술</button>
        <button class="fpill" data-f="개발">개발</button>
        <button class="fpill" data-f="품질">품질</button>
        <button class="fpill" data-f="영업">영업</button>
        <button class="fpill" data-f="구매">구매</button>
        <button class="fpill" data-f="물류/자재관리">물류</button>
        <button class="fpill" data-f="인사">인사</button>
        <button class="fpill" data-f="기획">기획</button>
        <button class="fpill" data-f="AX PMO">AX PMO</button>
        <button class="fpill" data-f="기타">기타</button>
      </div>
      <div class="hero-actions">
        <button class="btn-export" id="btnExport" title="현재 과제 목록을 JSON으로 저장">
          <svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>내보내기
        </button>
        <button class="btn-import" id="btnImport" title="JSON 파일로 과제 가져오기">
          <svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>가져오기
        </button>
        <input type="file" id="importFile" accept=".json">
        <button class="btn-new" id="btnNew">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
          새로 만들기
        </button>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- ADD TASK MODAL -->
<div class="backdrop" id="backdrop">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">새 과제 등록</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">부서 *</label>
          <select class="form-select" id="fDept">
            <option value="">선택하세요</option>
            <option>제조기술</option><option>개발</option><option>품질</option>
            <option>영업</option><option>구매</option><option>물류/자재관리</option>
            <option>인사</option><option>기획</option><option>AX PMO</option>
            <option>SCM</option><option>생산관리</option><option>마케팅</option>
            <option>재무</option><option>경영지원</option><option>기타</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">상태 *</label>
          <select class="form-select" id="fStatus">
            <option value="운영 중">운영 중</option>
            <option value="검토 중">검토 중</option>
            <option value="업데이트">업데이트</option>
            <option value="개발 중">개발 중</option>
          </select>
        </div>
      </div>
      <div class="form-group full">
        <label class="form-label">과제명 *</label>
        <input type="text" class="form-input" id="fName" placeholder="예: 불량 검출 AI 시스템">
      </div>
      <div class="form-group full">
        <label class="form-label">앱 URL *</label>
        <input type="url" class="form-input" id="fUrl" placeholder="https://...">
        <span class="form-hint">카드 클릭 시 이 주소로 이동합니다</span>
      </div>
      <div class="form-group full">
        <label class="form-label">설명</label>
        <textarea class="form-textarea" id="fDesc" placeholder="과제 또는 앱에 대한 간단한 설명을 입력하세요"></textarea>
      </div>
      <div class="section-title">📊 KPI 지표 (선택 — 최대 4개)</div>
      <div class="kpi-grid">
        <div class="form-group">
          <div class="kpi-label-text">KPI 1</div>
          <div class="kpi-pair">
            <input type="text" class="form-input" id="kl1" placeholder="항목명">
            <input type="text" class="form-input" id="kv1" placeholder="값">
          </div>
        </div>
        <div class="form-group">
          <div class="kpi-label-text">KPI 2</div>
          <div class="kpi-pair">
            <input type="text" class="form-input" id="kl2" placeholder="항목명">
            <input type="text" class="form-input" id="kv2" placeholder="값">
          </div>
        </div>
        <div class="form-group">
          <div class="kpi-label-text">KPI 3</div>
          <div class="kpi-pair">
            <input type="text" class="form-input" id="kl3" placeholder="항목명">
            <input type="text" class="form-input" id="kv3" placeholder="값">
          </div>
        </div>
        <div class="form-group">
          <div class="kpi-label-text">KPI 4</div>
          <div class="kpi-pair">
            <input type="text" class="form-input" id="kl4" placeholder="항목명">
            <input type="text" class="form-input" id="kv4" placeholder="값">
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" id="btnCancel">취소</button>
      <button class="btn-submit" id="btnSubmit">등록</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════
   SVG HELPERS (generic charts용)
══════════════════════════════════════════ */
function lp(data,x,y,w,h){
  const n=data.length-1;
  return data.map((v,i)=>{const px=(x+i*(w/n)).toFixed(1),py=(y+h-(v/100)*h).toFixed(1);return(i===0?'M':'L')+px+','+py;}).join(' ');
}
function la(data,x,y,w,h){return lp(data,x,y,w,h)+` L${(x+w).toFixed(1)},${(y+h).toFixed(1)} L${x},${(y+h).toFixed(1)} Z`;}
function arcPath(cx,cy,r,pct,color,sw){
  if(pct>=100)return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"/>`;
  const a=(pct/100)*360,rad=(a-90)*Math.PI/180;
  const x=(cx+r*Math.cos(rad)).toFixed(2),y=(cy+r*Math.sin(rad)).toFixed(2);
  return`<path d="M${cx},${cy-r} A${r},${r} 0 ${a>180?1:0},1 ${x},${y}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
}

/* ── 공통 썸네일 outer shell (sidebar + tag + KPI boxes) ── */
function makeSVG(t){
  const c=t.color,bg=t.thumbBg;
  const W=340,H=198,SB=44,CX=SB+8,CW=W-CX-6;
  const kw=Math.floor((CW-9)/4),kh=36,ky=30;
  const cy=ky+kh+6,ch=H-cy-4; // chart area: y=72, height=122

  const sb=`<rect x="0" y="0" width="${SB}" height="${H}" fill="#1E3A8A"/>
    ${[14,27,40,53,66,79].map((yy,i)=>`<rect x="8" y="${yy}" width="${i===2?29:22}" height="3" rx="1.5" fill="white" opacity="${i===2?.85:.25}"/>`).join('')}
    <circle cx="22" cy="${H-15}" r="9" fill="white" opacity=".15"/>`;

  const tag=`<rect x="${CX}" y="10" width="58" height="14" rx="5" fill="${c}"/>
    <text x="${CX+29}" y="20.5" text-anchor="middle" fill="white" font-size="7.5" font-weight="700" font-family="'Noto Sans KR',sans-serif">${t.dept}</text>`;

  const kpis=t.kpis.map((k,i)=>{
    const bx=CX+i*(kw+3);
    return `<rect x="${bx}" y="${ky}" width="${kw}" height="${kh}" rx="4" fill="white"/>
      <text x="${bx+6}" y="${ky+11.5}" fill="#94A3B8" font-size="6.5" font-family="sans-serif">${k.label}</text>
      <text x="${bx+6}" y="${ky+27}" fill="#0F172A" font-size="12.5" font-weight="800" font-family="sans-serif">${k.value}</text>`;
  }).join('');

  const chartArea=(t.id&&t.id.startsWith('b'))
    ?customChart(t.id,CX,cy,CW,ch,c,bg)
    :genericChart(t,CX,cy,CW,ch,c);

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${H}" fill="${bg}"/>
    ${sb}${tag}${kpis}${chartArea}
  </svg>`;
}

/* ── 사용자 추가 과제용 기본 차트 ── */
function genericChart(t,CX,cy,CW,ch,c){
  const dw=64,lw=CW-dw-6;
  const dcx=CX+lw+4+dw/2,dcy=cy+ch/2,dr=22;
  const lineChart=`<rect x="${CX}" y="${cy}" width="${lw}" height="${ch}" rx="4" fill="white"/>
    <path d="${la(t.lineData,CX+6,cy+5,lw-12,ch-10)}" fill="${c}" opacity=".12"/>
    <path d="${lp(t.lineData,CX+6,cy+5,lw-12,ch-10)}" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    ${t.lineData.map((v,i)=>{const px=CX+6+i*((lw-12)/(t.lineData.length-1));const py=cy+5+ch-10-(v/100)*(ch-10);return`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2" fill="${c}"/>`;}).join('')}`;
  const donut=`<rect x="${CX+lw+4}" y="${cy}" width="${dw}" height="${ch}" rx="4" fill="white"/>
    <circle cx="${dcx}" cy="${dcy}" r="${dr}" fill="none" stroke="#E8EFF8" stroke-width="9"/>
    ${arcPath(dcx,dcy,dr,t.donut,c,9)}
    <text x="${dcx}" y="${dcy+4}" text-anchor="middle" fill="#0F172A" font-size="9.5" font-weight="800" font-family="sans-serif">${t.donut}%</text>`;
  return lineChart+donut;
}

/* ══════════════════════════════════════════
   과제별 고유 시각화 (14개)
   좌표계: x=CX(52)~334, y=cy(72)~194, w=CW(282), h=ch(122)
══════════════════════════════════════════ */
function customChart(id,CX,cy,CW,ch,c,bg){
  const x=CX,y=cy,w=CW,h=ch;
  const wb=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="white" opacity=".92"/>`;

  switch(id){

  /* ── b01 동작분석 & 라인 밸런스 ─ 5개 스테이션 바차트 + 택트타임 선 ── */
  case'b01':{
    const bars=[{h:50,o:.4},{h:88,o:.72},{h:32,o:.42},{h:65,o:.58},{h:74,o:.62}];
    const bw=38,gap=14,total=bars.length*(bw+gap)-gap;
    const sx=x+(w-total)/2,base=y+h-14;
    return wb+bars.map((b,i)=>`
      <rect x="${sx+i*(bw+gap)}" y="${base-b.h}" width="${bw}" height="${b.h}" rx="3" fill="${c}" opacity="${b.o}"/>
      <text x="${sx+i*(bw+gap)+bw/2}" y="${base+9}" text-anchor="middle" fill="#94A3B8" font-size="8" font-family="sans-serif">ST${i+1}</text>
    `).join('')+
    `<line x1="${x+6}" y1="${base-68}" x2="${x+w-6}" y2="${base-68}" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3"/>
     <rect x="${x+8}" y="${base-78}" width="50" height="13" rx="3" fill="#FEF2F2"/>
     <text x="${x+33}" y="${base-69}" text-anchor="middle" fill="#EF4444" font-size="8" font-weight="700" font-family="'Noto Sans KR',sans-serif">택트타임</text>
     <text x="${x+w-8}" y="${base-69}" text-anchor="end" fill="${c}" font-size="7.5" font-family="sans-serif">라인 밸런스율 72%→94%</text>`;
  }

  /* ── b02 인사규정 챗봇 ─ 채팅 대화 UI ── */
  case'b02':{
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#F5F3FF" opacity=".95"/>
      <rect x="${x+w-148}" y="${y+7}" width="136" height="22" rx="11" fill="${c}" opacity=".8"/>
      <text x="${x+w-80}" y="${y+22}" text-anchor="middle" fill="white" font-size="9" font-family="'Noto Sans KR',sans-serif">연차 신청 방법은?</text>
      <rect x="${x+8}" y="${y+34}" width="192" height="30" rx="11" fill="white"/>
      <rect x="${x+8}" y="${y+34}" width="192" height="30" rx="11" fill="${c}" opacity=".1"/>
      <text x="${x+104}" y="${y+48}" text-anchor="middle" fill="${c}" font-size="8.5" font-family="'Noto Sans KR',sans-serif">근무 1년 후 15일 발생합니다.</text>
      <text x="${x+104}" y="${y+59}" text-anchor="middle" fill="${c}" font-size="8.5" font-family="'Noto Sans KR',sans-serif">현재 잔여: 8일 ✅</text>
      <rect x="${x+w-120}" y="${y+70}" width="108" height="22" rx="11" fill="${c}" opacity=".8"/>
      <text x="${x+w-66}" y="${y+85}" text-anchor="middle" fill="white" font-size="9" font-family="'Noto Sans KR',sans-serif">감사합니다 🙏</text>
      <rect x="${x+8}" y="${y+98}" width="88" height="17" rx="8" fill="${c}" opacity=".15"/>
      <text x="${x+52}" y="${y+110}" text-anchor="middle" fill="${c}" font-size="9" font-weight="700" font-family="'Noto Sans KR',sans-serif">🤖 HR AI Bot</text>
      <rect x="${x+8}" y="${y+h-16}" width="${w-16}" height="12" rx="6" fill="white"/>
      <rect x="${x+8}" y="${y+h-16}" width="${w-16}" height="12" rx="6" fill="${c}" opacity=".08"/>
      <text x="${x+20}" y="${y+h-7}" fill="#CBD5E1" font-size="8" font-family="'Noto Sans KR',sans-serif">규정을 물어보세요...</text>`;
  }

  /* ── b03 PCB 수율 ─ 부품 그리드 결함맵 ── */
  case'b03':{
    const pass=[1,1,1,1,1, 1,1,0,1,1, 1,1,1,1,0, 1,1,1,1,1];
    const cols=5,rows=4,pw=36,ph=20,gx=6,gy=5;
    const totalW=cols*(pw+gx)-gx,totalH=rows*(ph+gy)-gy;
    const sx=x+(w-totalW)/2,sy=y+6;
    return wb+pass.map((p,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const bx=sx+col*(pw+gx),by=sy+row*(ph+gy);
      return `<rect x="${bx}" y="${by}" width="${pw}" height="${ph}" rx="3" fill="${p?c:'#EF4444'}" opacity="${p?.5:.85}"/>
        ${!p?`<text x="${bx+pw/2}" y="${by+ph/2+3.5}" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif">✕</text>`:`<rect x="${bx+10}" y="${by+8}" width="16" height="4" rx="2" fill="white" opacity=".4"/>`}`;
    }).join('')+
    `<rect x="${x+8}" y="${y+h-18}" width="${w-16}" height="14" rx="4" fill="${c}" opacity=".1"/>
     <text x="${x+w/2}" y="${y+h-8}" text-anchor="middle" fill="${c}" font-size="9" font-weight="700" font-family="'Noto Sans KR',sans-serif">수율 96.4% | 불량 2/20 (3.6%) | 패턴 분석 중</text>`;
  }

  /* ── b04 DOE 마스터 ─ 실험설계 매트릭스 ── */
  case'b04':{
    const rows2=[
      ['1','+','-','-','8.2'],[' 2','-','+','-','7.6'],
      ['3','+','+','-','9.1'],['4','-','-','+','6.8'],
      ['5','+','-','+','8.8'],['6','-','+','+','7.2'],
      ['★7','+','+','+','9.8'],
    ];
    const sx=x+8,sy=y+4,rh2=16;
    return wb+
    `<rect x="${sx}" y="${sy}" width="${w-16}" height="13" rx="3" fill="${c}" opacity=".2"/>
     ${['Run','A','B','C','결과(Y)'].map((h2,i)=>`<text x="${sx+[6,36,60,82,108][i]}" y="${sy+10}" fill="${c}" font-size="8.5" font-weight="700" font-family="sans-serif">${h2}</text>`).join('')}`+
    rows2.map((row,ri)=>{
      const ry=sy+13+ri*rh2;
      const isOpt=row[0].includes('★');
      return `<rect x="${sx}" y="${ry}" width="${w-16}" height="${rh2-1}" rx="2" fill="${isOpt?c:'transparent'}" opacity="${isOpt?.15:0}"/>
        <text x="${sx+6}" y="${ry+11}" fill="${isOpt?c:'#64748B'}" font-size="${isOpt?9:8}" font-weight="${isOpt?700:400}" font-family="sans-serif">${row[0]}</text>
        ${row.slice(1,4).map((v,ci)=>`<text x="${sx+36+ci*24}" y="${ry+11}" text-anchor="middle" fill="${v==='+'?c:'#EF4444'}" font-size="11" font-weight="700" font-family="sans-serif">${v}</text>`).join('')}
        <text x="${sx+108}" y="${ry+11}" fill="${isOpt?c:'#0F172A'}" font-size="${isOpt?9:8}" font-weight="${isOpt?700:400}" font-family="sans-serif">${row[4]}${isOpt?' ← 최적':''}</text>`;
    }).join('');
  }

  /* ── b05 판매 Dashboard ─ 지역별 매출 바차트 ── */
  case'b05':{
    const regions=[{n:'NA',v:980},{n:'EU',v:720},{n:'APAC',v:680},{n:'KR',v:380},{n:'JP',v:220}];
    const maxV=980,bw=36,gap=16,total=regions.length*(bw+gap)-gap;
    const sx=x+(w-total)/2,base=y+h-16,maxBarH=h-30;
    return wb+regions.map((r,i)=>{
      const bh=Math.round((r.v/maxV)*maxBarH);
      const bx=sx+i*(bw+gap);
      const alpha=0.35+i*(0.12);
      return `<rect x="${bx}" y="${base-bh}" width="${bw}" height="${bh}" rx="4" fill="${c}" opacity="${alpha}"/>
        <text x="${bx+bw/2}" y="${base-bh-4}" text-anchor="middle" fill="${c}" font-size="7.5" font-weight="700" font-family="sans-serif">${r.v}M</text>
        <text x="${bx+bw/2}" y="${base+10}" text-anchor="middle" fill="#64748B" font-size="8.5" font-family="sans-serif">${r.n}</text>`;
    }).join('')+
    `<line x1="${x+6}" y1="${y+8}" x2="${x+w-6}" y2="${y+8}" stroke="${c}" stroke-width=".5" opacity=".2"/>
     <text x="${x+10}" y="${y+16}" fill="${c}" font-size="8.5" font-weight="700" font-family="sans-serif">총 ₩2,980M</text>
     <text x="${x+w-10}" y="${y+16}" text-anchor="end" fill="#059669" font-size="8.5" font-weight="700" font-family="sans-serif">▲ +18.4%</text>`;
  }

  /* ── b06 공정능력지수 ─ 정규분포 + USL/LSL ── */
  case'b06':{
    const cx2=x+w/2,cy2=y+h/2-4;
    return wb+
    `<line x1="${x+46}" y1="${y+8}" x2="${x+46}" y2="${y+h-14}" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>
     <line x1="${x+w-46}" y1="${y+8}" x2="${x+w-46}" y2="${y+h-14}" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>
     <text x="${x+46}" y="${y+h-6}" text-anchor="middle" fill="#EF4444" font-size="8.5" font-weight="700" font-family="sans-serif">LSL</text>
     <text x="${x+w-46}" y="${y+h-6}" text-anchor="middle" fill="#EF4444" font-size="8.5" font-weight="700" font-family="sans-serif">USL</text>
     <path d="M${x+38} ${y+h-14}
       C${x+58} ${y+h-14} ${x+75} ${y+h-32} ${x+95} ${y+h-55}
       C${x+115} ${y+18} ${cx2-18} ${y+7} ${cx2} ${y+7}
       C${cx2+18} ${y+7} ${x+w-115} ${y+18} ${x+w-95} ${y+h-55}
       C${x+w-75} ${y+h-32} ${x+w-58} ${y+h-14} ${x+w-38} ${y+h-14} Z"
       stroke="${c}" stroke-width="2" fill="${c}" fill-opacity=".2"/>
     <line x1="${cx2}" y1="${y+10}" x2="${cx2}" y2="${y+h-14}" stroke="${c}" stroke-width="1.5" stroke-dasharray="3,3" opacity=".5"/>
     <rect x="${x+8}" y="${y+8}" width="64" height="24" rx="4" fill="${c}" opacity=".1"/>
     <text x="${x+40}" y="${y+19}" text-anchor="middle" fill="${c}" font-size="8" font-weight="700" font-family="sans-serif">Cp = 1.67</text>
     <text x="${x+40}" y="${y+28}" text-anchor="middle" fill="${c}" font-size="8" font-weight="700" font-family="sans-serif">Cpk = 1.43</text>
     <text x="${cx2}" y="${y+h-6}" text-anchor="middle" fill="#94A3B8" font-size="8" font-family="'Noto Sans KR',sans-serif">공정 안정 ✅ 6σ 수준</text>`;
  }

  /* ── b07 환율 모니터링 ─ 4개 통화 + 스파크라인 ── */
  case'b07':{
    const currencies=[
      {pair:'USD/KRW',val:'1,342',dir:'▲',col:'#059669',sp:'M0,22 L12,19 L24,21 L36,16 L48,13 L60,11 L72,9'},
      {pair:'JPY/KRW',val:'9.02', dir:'▼',col:'#EF4444',sp:'M0,10 L12,13 L24,12 L36,16 L48,18 L60,19 L72,22'},
      {pair:'EUR/KRW',val:'1,468',dir:'▲',col:'#059669',sp:'M0,20 L12,17 L24,14 L36,12 L48,10 L60,8 L72,6'},
      {pair:'CNY/KRW',val:'186',  dir:'▼',col:'#EF4444',sp:'M0,8 L12,11 L24,13 L36,15 L48,17 L60,19 L72,22'},
    ];
    const rh2=27,ry0=y+5;
    return wb+currencies.map((cur,i)=>{
      const ry=ry0+i*rh2;
      return `<rect x="${x+6}" y="${ry}" width="${w-12}" height="${rh2-2}" rx="4" fill="${c}" opacity="${i%2===0?.06:.03}"/>
        <text x="${x+14}" y="${ry+16}" fill="#0F172A" font-size="9.5" font-weight="700" font-family="sans-serif">${cur.pair}</text>
        <text x="${x+w/2+10}" y="${ry+16}" text-anchor="middle" fill="${cur.col}" font-size="11" font-weight="800" font-family="sans-serif">${cur.dir} ${cur.val}</text>
        <g transform="translate(${x+w-84},${ry+3})">
          <path d="${cur.sp}" stroke="${cur.col}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        </g>`;
    }).join('');
  }

  /* ── b08 비철금속 ─ 금속별 수평 바차트 ── */
  case'b08':{
    const metals=[
      {n:'Cu  구리', v:8420, maxV:18000, col:'#B45309'},
      {n:'Al  알루미늄',v:2395, maxV:18000, col:'#64748B'},
      {n:'Ni  니켈',  v:16820,maxV:18000, col:'#0891B2'},
      {n:'Zn  아연',  v:2890, maxV:18000, col:'#059669'},
    ];
    const maxBW=w-148,bh=18,gap=9,sy=y+8;
    return wb+metals.map((m,i)=>{
      const bw=Math.round((m.v/m.maxV)*maxBW),by=sy+i*(bh+gap);
      return `<text x="${x+10}" y="${by+13}" fill="#0F172A" font-size="9.5" font-weight="700" font-family="sans-serif">${m.n}</text>
        <rect x="${x+124}" y="${by+2}" width="${maxBW}" height="${bh-4}" rx="3" fill="#F1F5F9"/>
        <rect x="${x+124}" y="${by+2}" width="${bw}" height="${bh-4}" rx="3" fill="${m.col}" opacity=".75"/>
        <text x="${x+124+bw+6}" y="${by+13}" fill="${m.col}" font-size="9" font-weight="700" font-family="sans-serif">$${m.v.toLocaleString()}</text>`;
    }).join('')+
    `<text x="${x+w/2}" y="${y+h-4}" text-anchor="middle" fill="#94A3B8" font-size="8" font-family="'Noto Sans KR',sans-serif">LME 현물가 ($/톤) — 실시간 수집</text>`;
  }

  /* ── b09 퍼스널 컬러 ─ 컬러 팔레트 ── */
  case'b09':{
    const swatches=[
      {col:'#FF6B6B',lab:'봄·웜'},{col:'#FFD166',lab:'여름·뉴트'},
      {col:'#FF9E7A',lab:'가을·웜'},{col:'#C9B1FF',lab:'겨울·쿨'},
      {col:'#06D6A0',lab:'스프링'},{col:'#118AB2',lab:'윈터'},
    ];
    const r=26;
    const pos=[
      {cx:x+46,cy:y+38},{cx:x+116,cy:y+20},{cx:x+186,cy:y+38},
      {cx:x+254,cy:y+20},{cx:x+320,cy:y+38},
    ];
    const pos2=[
      {cx:x+46,cy:y+20},{cx:x+116,cy:y+38},{cx:x+186,cy:y+20},
      {cx:x+254,cy:y+38},{cx:x+320,cy:y+20},
    ];
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#FDF4FF" opacity=".95"/>
      ${[['#FF6B6B','봄'],['#FFD166','여름'],['#FF9E7A','가을'],['#C9B1FF','겨울'],['#06D6A0','봄쿨']].map((s,i)=>`
        <circle cx="${x+46+i*58}" cy="${y+38}" r="${r}" fill="${s[0]}" opacity=".82"/>
        <text x="${x+46+i*58}" y="${y+38+r+11}" text-anchor="middle" fill="#64748B" font-size="8.5" font-family="'Noto Sans KR',sans-serif">${s[1]}</text>
      `).join('')}
      <rect x="${x+8}" y="${y+h-20}" width="${w-16}" height="15" rx="4" fill="${c}" opacity=".12"/>
      <text x="${x+w/2}" y="${y+h-9}" text-anchor="middle" fill="${c}" font-size="9.5" font-weight="700" font-family="'Noto Sans KR',sans-serif">📸 사진 한 장으로 나만의 퍼스널 컬러 분석</text>`;
  }

  /* ── b10 재고관리 ─ 창고 재고 히트맵 ── */
  case'b10':{
    const grid=[
      [.75,.42,.92,.55,.62],
      [.30,.82,.22,.74,.50],
      [.60,.50,.85,.30,.95],
      [.45,.70,.55,.60,.20],
    ];
    const cw2=44,ch2=21,gx=4,gy=4;
    const sx=x+8,sy=y+6;
    const classColors=['#2563EB','#2563EB','#7C3AED','#7C3AED','#94A3B8'];
    return wb+grid.map((row,ri)=>row.map((v,ci)=>{
      const bx=sx+ci*(cw2+gx),by=sy+ri*(ch2+gy);
      const alpha=0.18+v*0.7;
      return `<rect x="${bx}" y="${by}" width="${cw2}" height="${ch2}" rx="3" fill="${classColors[ci]}" opacity="${alpha}"/>

  /* ── b12 기업 경쟁력 ─ 레이더 차트 ── */

      const a=(i*72-90)*Math.PI/180;
      return {
        ox:cx2+R*Math.cos(a),oy:cy2+R*Math.sin(a),
        sx:cx2+R*scores[i]*Math.cos(a),sy:cy2+R*scores[i]*Math.sin(a),
        lx:cx2+(R+15)*Math.cos(a),ly:cy2+(R+15)*Math.sin(a),a

    const pentagon=pts.map((p,i)=>(i===0?'M':'L')+p.ox.toFixed(1)+','+p.oy.toFixed(1)).join(' ')+'Z';

/* ══════════════════════════════════════════
   STORAGE HELPERS
══════════════════════════════════════════ */
const STORE_KEY='ax-gallery-custom-v2';
function loadCustom(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch{return[]}}
function saveCustom(arr){localStorage.setItem(STORE_KEY,JSON.stringify(arr))}

/* ══════════════════════════════════════════
   TASK GENERATION HELPERS
══════════════════════════════════════════ */
function hashNum(str,min,max){
  let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))&0xffffffff;
  return min+Math.abs(h)%(max-min+1);
}
function genLineData(seed){
  const data=[];let v=hashNum(seed,40,60);
  for(let i=0;i<10;i++){v=Math.min(95,Math.max(20,v+hashNum(seed+i,-8,12)));data.push(v);}
  return data;
}
function defaultKpis(dept,name){
  const defaults={
    '제조기술':[{label:'생산효율',value:'+15%'},{label:'불량률',value:'2.1%'},{label:'처리건',value:'1,240'},{label:'개선율',value:'+18%'}],
    '개발':[{label:'완성도',value:'94%'},{label:'버그',value:'3건'},{label:'배포',value:'12회'},{label:'성능',value:'+22%'}],
    '품질':[{label:'합격률',value:'98.5%'},{label:'불량',value:'1.5%'},{label:'검사건',value:'3,200'},{label:'Cpk',value:'1.45'}],
    '영업':[{label:'매출',value:'₩1.8B'},{label:'성장률',value:'+14%'},{label:'고객',value:'245'},{label:'계약',value:'892'}],
    '구매':[{label:'절감율',value:'8.2%'},{label:'납기율',value:'97%'},{label:'협력사',value:'48'},{label:'발주건',value:'1,560'}],
    '물류/자재관리':[{label:'재고율',value:'96%'},{label:'SKU',value:'2,800'},{label:'회전율',value:'4.5'},{label:'절감',value:'11%'}],
    '인사':[{label:'처리건',value:'320'},{label:'만족도',value:'4.7'},{label:'해결율',value:'92%'},{label:'응답시간',value:'2분'}],
    '기획':[{label:'분석건',value:'18'},{label:'지표',value:'36개'},{label:'달성율',value:'82%'},{label:'과제',value:'12개'}],
    'AX PMO':[{label:'과제',value:'20'},{label:'완료',value:'16건'},{label:'진행',value:'4건'},{label:'달성율',value:'80%'}],
  };
  return defaults[dept]||[{label:'처리건',value:hashNum(name,100,999).toString()},{label:'완성도',value:hashNum(name+'a',65,98)+'%'},{label:'만족도',value:(hashNum(name+'b',35,50)/10).toFixed(1)},{label:'개선율',value:'+'+hashNum(name+'c',8,28)+'%'}];
}
function buildTask(f){
  const cfg=DC[f.dept]||DC['기타'];
  const kpis=f.kpis&&f.kpis.filter(k=>k.label||k.value).length>=2?f.kpis:defaultKpis(f.dept,f.name);
  while(kpis.length<4)kpis.push({label:'',value:'-'});
  const rows=[{label:f.dept+' AI 과제',val:'진행중'},{label:'등록일',val:new Date().toLocaleDateString('ko-KR')},{label:'상태',val:f.status}];
  return{id:f.id||('c'+Date.now()),dept:f.dept,name:f.name,url:f.url,desc:f.desc||'',status:f.status,
    color:cfg.color,thumbBg:cfg.iconBg,kpis:kpis.slice(0,4),
    lineData:genLineData(f.name),donut:hashNum(f.name+'d',60,96),
    tableRows:rows,isCustom:true};
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
let curFilter='all';
let openMenu=null;

function allTasks(){return[...BUILTIN,...loadCustom()];}

function render(f){
  curFilter=f;
  const all=allTasks();
  const list=f==='all'?all:all.filter(t=>t.dept===f);
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML='<div class="empty">해당 부서의 과제가 없습니다.</div>';return;}
  grid.innerHTML=list.map(t=>{
    const cfg=DC[t.dept]||DC['기타'];
    const sc=SC[t.status]||SC['운영 중'];
    const label=t.subLabel?t.dept+' · '+t.subLabel:t.dept;
    return `<div class="card" data-url="${t.url}" data-id="${t.id}">
      <div class="card-inner">
        <div class="thumb">${makeSVG(t)}</div>
        <div class="cbody">
          <div class="cicon" style="background:${cfg.iconBg}">${cfg.emoji}</div>
          <div class="cinfo">
            <div class="cname-row">
              <div class="cname" title="${t.name}">${t.name}</div>
              <div class="cdots" data-id="${t.id}" data-custom="${!!t.isCustom}">···
                <div class="cdots-menu" id="menu-${t.id}">
                  <div class="cdots-menu-item" data-action="open" data-url="${t.url}">
                    <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/></svg>앱 실행
                  </div>
                  ${t.isCustom?`
                  <div class="cdots-menu-item" data-action="edit" data-id="${t.id}">
                    <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>수정
                  </div>
                  <div class="cdots-menu-item danger" data-action="del" data-id="${t.id}">
                    <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>삭제
                  </div>`:''}
                </div>
              </div>
            </div>
            <div class="cdesc">${t.desc||''}</div>
            <span class="cstatus" style="background:${sc.bg};color:${sc.color}">
              <span class="sdot" style="background:${sc.color}"></span>${t.status}
            </span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Card click → open URL
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.closest('.cdots'))return;
      const url=card.dataset.url;
      if(url)window.open(url,'_blank','noopener');
    });
  });

  // Dots menu
  document.querySelectorAll('.cdots').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const menu=document.getElementById('menu-'+el.dataset.id);
      const isOpen=menu.classList.contains('open');
      closeMenus();
      if(!isOpen){menu.classList.add('open');openMenu=menu;}
    });
  });

  document.querySelectorAll('[data-action]').forEach(item=>{
    item.addEventListener('click',e=>{
      e.stopPropagation();
      const act=item.dataset.action;
      if(act==='open'){window.open(item.dataset.url,'_blank','noopener');}
      else if(act==='del'){deleteTask(item.dataset.id);}
      else if(act==='edit'){editTask(item.dataset.id);}
      closeMenus();
    });
  });
}

function closeMenus(){
  document.querySelectorAll('.cdots-menu.open').forEach(m=>m.classList.remove('open'));
  openMenu=null;
}
document.addEventListener('click',()=>closeMenus());

/* ══════════════════════════════════════════
   CRUD
══════════════════════════════════════════ */
function deleteTask(id){
  if(!confirm('이 과제를 삭제하시겠습니까?'))return;
  const arr=loadCustom().filter(t=>t.id!==id);
  saveCustom(arr);
  render(curFilter);
  toast('과제가 삭제됐습니다.');
}

function editTask(id){
  const task=loadCustom().find(t=>t.id===id);
  if(!task)return;
  document.getElementById('editId').value=id;
  document.getElementById('modalTitle').textContent='과제 수정';
  document.getElementById('btnSubmit').textContent='저장';
  document.getElementById('fDept').value=task.dept;
  document.getElementById('fStatus').value=task.status;
  document.getElementById('fName').value=task.name;
  document.getElementById('fUrl').value=task.url;
  document.getElementById('fDesc').value=task.desc||'';
  for(let i=1;i<=4;i++){
    const k=task.kpis[i-1]||{label:'',value:''};
    document.getElementById('kl'+i).value=k.label||'';
    document.getElementById('kv'+i).value=k.value||'';
  }
  openModal();
}

/* ══════════════════════════════════════════
   MODAL
══════════════════════════════════════════ */
function openModal(){document.getElementById('backdrop').classList.add('open');}
function closeModal(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('editId').value='';
  document.getElementById('modalTitle').textContent='새 과제 등록';
  document.getElementById('btnSubmit').textContent='등록';
  ['fDept','fStatus','fName','fUrl','fDesc'].forEach(id=>{
    const el=document.getElementById(id);
    if(el.tagName==='SELECT')el.value=id==='fStatus'?'운영 중':'';
    else el.value='';
  });
  for(let i=1;i<=4;i++){document.getElementById('kl'+i).value='';document.getElementById('kv'+i).value='';}
}

document.getElementById('btnNew').onclick=openModal;
document.getElementById('btnCancel').onclick=closeModal;
document.getElementById('modalClose').onclick=closeModal;
document.getElementById('backdrop').addEventListener('click',e=>{if(e.target===document.getElementById('backdrop'))closeModal();});

document.getElementById('btnSubmit').onclick=()=>{
  const dept=document.getElementById('fDept').value.trim();
  const name=document.getElementById('fName').value.trim();
  const url=document.getElementById('fUrl').value.trim();
  if(!dept){alert('부서를 선택하세요.');return;}
  if(!name){alert('과제명을 입력하세요.');return;}
  if(!url){alert('앱 URL을 입력하세요.');return;}
  const kpis=[];
  for(let i=1;i<=4;i++){
    const l=document.getElementById('kl'+i).value.trim();
    const v=document.getElementById('kv'+i).value.trim();
    if(l||v)kpis.push({label:l||'지표',value:v||'-'});
  }
  const editId=document.getElementById('editId').value;
  const arr=loadCustom();
  if(editId){
    const idx=arr.findIndex(t=>t.id===editId);
    if(idx>=0){
      arr[idx]=buildTask({id:editId,dept,name,url,status:document.getElementById('fStatus').value,desc:document.getElementById('fDesc').value.trim(),kpis});
      arr[idx].isCustom=true;
    }
    saveCustom(arr);
    toast('과제가 수정됐습니다. ✅');
  } else {
    arr.push(buildTask({dept,name,url,status:document.getElementById('fStatus').value,desc:document.getElementById('fDesc').value.trim(),kpis}));
    saveCustom(arr);
    toast('새 과제가 등록됐습니다! 🎉');
  }
  closeModal();
  render(curFilter);
};

/* ══════════════════════════════════════════
   EXPORT / IMPORT
══════════════════════════════════════════ */
document.getElementById('btnExport').onclick=()=>{
  const data=JSON.stringify(loadCustom(),null,2);
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);
  a.download='ax-tasks-custom-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('내보내기 완료! 📥');
};

document.getElementById('btnImport').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=function(){
  const file=this.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const arr=JSON.parse(e.target.result);
      if(!Array.isArray(arr))throw new Error();
      saveCustom(arr);
      render(curFilter);
      toast('가져오기 완료! '+arr.length+'개 과제 로드됨 ✅');
    }catch{alert('올바른 JSON 파일이 아닙니다.');}
  };
  reader.readAsText(file);
  this.value='';
};

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

/* ══════════════════════════════════════════
   FILTERS
══════════════════════════════════════════ */
document.querySelectorAll('.fpill').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fpill').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render(b.dataset.f);
}));

/* INIT */
render('all');
</script>
